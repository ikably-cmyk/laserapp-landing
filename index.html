<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta id="meta-desc" name="description" content="">
<meta property="og:title" content="LaserRx — Clinical AI for Dental Laser">
<meta id="og-desc" property="og:description" content="">
<meta property="og:url" content="https://laserapp.ai">
<meta property="og:type" content="website">
<title>LaserRx — Clinical AI for Dental Laser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B263B;
  --navy2:#2C3A52;
  --ink:#0D1B2A;
  --steel:#778DA9;
  --steelMute:#8FA0B8;
  --cream:#E0E1DD;
  --white:#FBFAF6;
  --paper:#F4F5F2;
  --hairline:#D8DAD3;
  --hairlineSoft:#E6E7E0;
  --devices:    oklch(0.62 0.07 195);
  --protocols:  oklch(0.66 0.09 70);
  --validate:   oklch(0.62 0.08 150);
  --calculator: oklch(0.58 0.07 290);
  --amber:      oklch(0.66 0.09 70);
  --amberDeep:  oklch(0.58 0.10 65);
  --sans:'Instrument Sans','Noto Sans KR','Noto Sans JP',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
html,body{background:var(--paper);color:var(--navy);font-family:var(--sans);letter-spacing:-0.005em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:0.09em;font-weight:700}
.hairline{border:none;border-top:1px solid var(--hairline);margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* ─── NAV ─── */
nav.top{
  position:sticky;top:0;z-index:90;background:rgba(244,245,242,.88);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--hairline);
}
.nav-in{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:30px;height:30px;background:var(--ink);border:1px solid var(--navy2);
  border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;color:var(--cream);font-size:12px;letter-spacing:0.02em;
}
.brand-name{font-size:15px;font-weight:600;color:var(--navy)}
.brand-name .rx{color:var(--steel);font-weight:400}
.nav-right{display:flex;align-items:center;gap:10px}
.lang-pick{display:flex;gap:0;background:var(--white);border:1px solid var(--hairline);border-radius:3px;padding:2px}
.lb{padding:5px 9px;border:none;background:transparent;border-radius:2px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--steel);cursor:pointer;letter-spacing:0.08em}
.lb.on{background:var(--navy);color:var(--cream)}
.signin{
  font-size:12px;font-weight:500;color:var(--navy);
  padding:7px 12px;border:1px solid var(--hairline);background:var(--white);
  border-radius:3px;transition:border-color .15s
}
.signin:hover{border-color:var(--navy)}

/* ─── HERO ─── */
.hero{
  background:var(--navy);color:var(--cream);
  border-radius:4px;margin-top:24px;padding:64px 56px 56px;
  position:relative;overflow:hidden;
  border:1px solid var(--navy2);
}
.hero-grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(232,228,219,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(232,228,219,.04) 1px,transparent 1px);
  background-size:48px 48px;
}
.hero-tag{
  position:absolute;top:24px;right:24px;display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:9px;color:var(--steelMute);letter-spacing:0.18em
}
.hero-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--validate);box-shadow:0 0 6px var(--validate)}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.16em;
  color:var(--steelMute);position:relative;margin-bottom:28px;
}
.hero-eyebrow::before{content:"";display:inline-block;width:18px;height:1px;background:var(--steel)}
.hero h1{
  font-size:56px;line-height:1.05;font-weight:500;color:var(--white);
  letter-spacing:-0.02em;max-width:820px;position:relative;
  text-wrap:balance;
}
.hero h1 .accent{color:var(--cream);font-style:italic;font-weight:400}
.hero h1 .pin{color:var(--protocols);font-style:normal}
.hero-sub{
  margin-top:20px;font-size:17px;line-height:1.55;color:var(--steelMute);
  max-width:560px;position:relative;
}
.hero-cta-row{margin-top:36px;display:flex;gap:10px;flex-wrap:wrap;position:relative;align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 22px;border-radius:3px;font-size:14px;font-weight:600;
  border:1px solid transparent;cursor:pointer;font-family:var(--sans);
  transition:transform .12s, background .12s, border-color .12s;
  letter-spacing:-0.005em;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--protocols);color:var(--ink);border-color:var(--protocols)}
.btn-primary:hover{background:var(--amberDeep);border-color:var(--amberDeep)}
.btn-ghost-light{background:transparent;color:var(--cream);border-color:rgba(224,225,221,.28)}
.btn-ghost-light:hover{border-color:var(--cream)}
.btn-tour{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.14em;
  color:var(--steelMute);background:transparent;border:none;cursor:pointer;
  padding:10px 0;margin-left:6px;
}
.btn-tour .play{
  width:22px;height:22px;border-radius:50%;border:1px solid var(--steelMute);
  display:inline-flex;align-items:center;justify-content:center;
  transition:border-color .15s, color .15s;
}
.btn-tour:hover{color:var(--cream)}
.btn-tour:hover .play{border-color:var(--cream);color:var(--cream)}

/* readouts row */
.readouts{
  margin-top:48px;display:grid;grid-template-columns:repeat(4,1fr);gap:0;
  border-top:1px solid var(--navy2);position:relative;
}
.ro{
  padding:24px 18px 6px 0;border-right:1px solid var(--navy2);
}
.ro:last-child{border-right:none}
.ro-num{
  font-family:var(--mono);font-size:32px;font-weight:700;color:var(--white);
  letter-spacing:-0.02em;line-height:1;
}
.ro-num .u{color:var(--steelMute);font-size:18px;margin-left:2px}
.ro-lbl{
  margin-top:10px;font-family:var(--mono);font-size:9px;font-weight:700;
  color:var(--steelMute);letter-spacing:0.12em;text-transform:uppercase;
}

/* ─── SECTION ─── */
section{padding:80px 0 0}
.sec-head{display:flex;flex-direction:column;gap:8px;margin-bottom:36px;max-width:680px}
.sec-eye{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--steel);letter-spacing:0.16em;text-transform:uppercase}
.sec-h{font-size:34px;line-height:1.15;font-weight:500;color:var(--navy);letter-spacing:-0.02em;text-wrap:balance}
.sec-sub{font-size:15px;line-height:1.6;color:var(--steel);max-width:560px}

/* ─── MODULES ─── */
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mod{
  background:var(--white);border:1px solid var(--hairline);
  border-left:3px solid var(--steel);
  border-radius:3px;padding:22px 20px 24px;display:flex;flex-direction:column;gap:10px;
  position:relative;transition:transform .15s, border-color .15s;
}
.mod:hover{transform:translateY(-2px)}
.mod[data-m="devices"]   {border-left-color:var(--devices)}
.mod[data-m="protocols"] {border-left-color:var(--protocols)}
.mod[data-m="validate"]  {border-left-color:var(--validate)}
.mod[data-m="calculator"]{border-left-color:var(--calculator)}
.mod-num{
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.14em;
  color:var(--steel);text-transform:uppercase;display:flex;justify-content:space-between;
}
.mod[data-m="devices"] .mod-num .label   {color:var(--devices)}
.mod[data-m="protocols"] .mod-num .label {color:var(--protocols)}
.mod[data-m="validate"] .mod-num .label  {color:var(--validate)}
.mod[data-m="calculator"] .mod-num .label{color:var(--calculator)}
.mod-name{font-size:18px;font-weight:600;color:var(--navy);letter-spacing:-0.01em;margin-top:4px}
.mod-desc{font-size:13px;line-height:1.55;color:var(--steel);flex:1}
.mod-meta{
  margin-top:10px;padding-top:12px;border-top:1px dashed var(--hairline);
  font-family:var(--mono);font-size:10px;color:var(--navy);letter-spacing:0.04em;
}

/* ─── HOW IT WORKS ─── */
.how-steps{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;
}
.how-step{
  background:var(--white);border:1px solid var(--hairline);border-radius:3px;
  padding:24px 22px;display:flex;flex-direction:column;gap:10px;position:relative;
}
.how-step .num{
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--steel);
  letter-spacing:0.16em;
}
.how-step .num .big{
  font-family:var(--sans);font-size:32px;font-weight:500;color:var(--navy);
  letter-spacing:-0.02em;display:block;margin-bottom:6px;line-height:1;
}
.how-step h4{font-size:16px;font-weight:600;color:var(--navy);letter-spacing:-0.01em;margin-top:6px}
.how-step p{font-size:13px;line-height:1.55;color:var(--steel)}
.how-step .ex{
  margin-top:10px;padding:10px 12px;background:var(--paper);border:1px dashed var(--hairline);
  border-radius:3px;font-family:var(--mono);font-size:11px;color:var(--navy);letter-spacing:0.02em;
  line-height:1.5;
}

.tour-panel{
  background:var(--navy);color:var(--cream);border:1px solid var(--navy2);
  border-radius:3px;padding:32px 36px;display:grid;
  grid-template-columns:1fr auto;gap:32px;align-items:center;
  position:relative;overflow:hidden;
}
.tour-panel::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(232,228,219,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(232,228,219,.04) 1px,transparent 1px);
  background-size:32px 32px;
}
.tour-panel-left{position:relative;display:flex;flex-direction:column;gap:8px}
.tour-panel-eye{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.16em;
  color:var(--protocols);text-transform:uppercase;display:flex;align-items:center;gap:10px;
}
.tour-panel-eye::before{content:"";display:inline-block;width:18px;height:1px;background:var(--protocols)}
.tour-panel h3{
  font-size:24px;line-height:1.25;font-weight:500;color:var(--white);
  letter-spacing:-0.015em;text-wrap:balance;max-width:480px;
}
.tour-panel-meta{
  display:flex;gap:14px;margin-top:8px;
  font-family:var(--mono);font-size:9px;color:var(--steelMute);letter-spacing:0.14em;text-transform:uppercase;
}
.tour-panel-meta span{display:inline-flex;align-items:center;gap:6px}
.tour-panel-meta .pip{width:5px;height:5px;border-radius:50%;background:var(--validate)}
.tour-launch{
  position:relative;display:inline-flex;align-items:center;gap:14px;
  padding:18px 26px;background:var(--protocols);color:var(--ink);
  border:none;border-radius:3px;font-family:var(--sans);font-size:14px;font-weight:600;
  cursor:pointer;letter-spacing:-0.005em;transition:background .12s, transform .12s;
}
.tour-launch:hover{background:var(--amberDeep)}
.tour-launch:active{transform:translateY(1px)}
.tour-launch .play-circle{
  width:32px;height:32px;border-radius:50%;background:var(--ink);
  display:flex;align-items:center;justify-content:center;color:var(--protocols);flex-shrink:0;
}

/* ─── DEMO ─── */
.demo-wrap{
  background:var(--white);border:1px solid var(--hairline);border-radius:3px;overflow:hidden;
}
.demo-top{
  background:var(--navy);padding:14px 18px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--navy2);
}
.demo-top .mark{
  width:26px;height:26px;background:var(--ink);border:1px solid var(--navy2);
  border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;color:var(--cream);font-size:11px;
}
.demo-top .name{color:var(--white);font-size:13px;font-weight:600}
.demo-top .crumb{
  font-family:var(--mono);font-size:9px;font-weight:700;color:var(--protocols);
  letter-spacing:0.16em;padding:3px 7px;border:1px solid var(--protocols);border-radius:3px;
  background:rgba(207,154,73,.08);
}
.demo-top .right{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9px;letter-spacing:0.14em;color:var(--steelMute)}
.demo-top .right .led{width:6px;height:6px;border-radius:50%;background:var(--validate);box-shadow:0 0 6px var(--validate)}
.demo-body{padding:22px;background:var(--paper);display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;max-width:78%}
.msg.u{align-self:flex-end;align-items:flex-end}
.msg.a{align-self:flex-start}
.bbl{
  padding:12px 16px;border-radius:3px;font-size:14px;line-height:1.55;
  border:1px solid var(--hairline);
}
.msg.u .bbl{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.msg.a .bbl{background:var(--white);color:var(--navy);border-left:3px solid var(--protocols)}
.bbl .ptag{
  display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;color:var(--protocols);
  letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px;
}
.bbl .lcd{
  display:block;background:var(--ink);color:var(--cream);font-family:var(--mono);
  font-size:12px;line-height:1.7;padding:10px 12px;border-radius:3px;margin-top:8px;
  border:1px solid var(--navy2);
}
.bbl .lcd .k{color:var(--steelMute)}
.bbl .lcd .v{color:var(--cream)}
.bbl .lcd .am{color:var(--protocols)}
.bbl .uphint{display:block;margin-top:10px;font-size:12px;color:var(--steel);font-style:italic}
.demo-foot{display:flex;gap:8px;padding:14px 18px;background:var(--white);border-top:1px solid var(--hairline)}
.demo-input{
  flex:1;padding:10px 14px;background:var(--paper);border:1px solid var(--hairline);
  border-radius:3px;font-size:13px;color:var(--steel);font-family:var(--sans);
}
.demo-send{padding:10px 18px;background:var(--navy);color:var(--cream);border:none;border-radius:3px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans)}

/* ─── PRICING ─── */
.cur-toggle{
  display:inline-flex;background:var(--white);border:1px solid var(--hairline);
  border-radius:3px;padding:3px;margin-bottom:28px;
}
.cur-btn{
  padding:8px 18px;border:none;background:transparent;font-family:var(--mono);
  font-size:10px;font-weight:700;letter-spacing:0.12em;color:var(--steel);cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;gap:8px;
}
.cur-btn.on{background:var(--navy);color:var(--cream)}
.cur-btn .flag{font-size:13px}

.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:stretch}
.plan{
  background:var(--white);border:1px solid var(--hairline);border-radius:3px;
  padding:28px 26px;display:flex;flex-direction:column;position:relative;
}
.plan.feat{
  background:var(--navy);border-color:var(--navy);color:var(--cream);
  box-shadow:0 18px 40px -22px rgba(13,27,42,.45);
}
.plan-eye{
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.16em;
  color:var(--steel);text-transform:uppercase;display:flex;align-items:center;gap:10px;
}
.plan.feat .plan-eye{color:var(--protocols)}
.plan-eye .badge{
  display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;
  background:var(--protocols);color:var(--ink);padding:3px 8px;border-radius:2px;letter-spacing:0.14em;
}
.plan-name{font-size:22px;font-weight:600;margin-top:12px;letter-spacing:-0.01em}
.plan.feat .plan-name{color:var(--white)}

.price-block{margin-top:20px;display:flex;align-items:flex-end;gap:10px}
.price-big{
  font-size:84px;font-weight:600;line-height:.92;letter-spacing:-0.04em;
  font-family:var(--sans);color:var(--navy);
}
.plan.feat .price-big{color:var(--white)}
.price-big .currency{font-size:28px;font-weight:500;vertical-align:top;color:var(--steel);margin-right:2px;letter-spacing:-0.02em}
.plan.feat .price-big .currency{color:var(--steelMute)}
.price-side{display:flex;flex-direction:column;gap:2px;padding-bottom:10px}
.price-unit{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--steel);
}
.plan.feat .price-unit{color:var(--steelMute)}
.price-cap{font-family:var(--mono);font-size:9px;color:var(--steel);letter-spacing:0.1em}
.plan.feat .price-cap{color:var(--steel)}

.price-sub{
  margin-top:14px;padding:10px 12px;background:var(--paper);
  border:1px dashed var(--hairline);border-radius:3px;
  font-family:var(--mono);font-size:11px;color:var(--navy);letter-spacing:0.02em;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.plan.feat .price-sub{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.14);color:var(--cream)}
.price-sub .x{color:var(--steel);text-transform:uppercase;letter-spacing:0.14em;font-size:9px}
.plan.feat .price-sub .x{color:var(--steelMute)}

.plan-desc{margin-top:18px;font-size:13px;line-height:1.55;color:var(--steel);min-height:54px}
.plan.feat .plan-desc{color:var(--steelMute)}

.feats{margin-top:18px;display:flex;flex-direction:column;gap:9px;flex:1}
.feat-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.45;color:var(--navy)}
.plan.feat .feat-row{color:var(--cream)}
.feat-row svg{flex-shrink:0;margin-top:3px}
.feat-row.off{color:var(--steel)}
.plan.feat .feat-row.off{color:var(--steelMute);opacity:.55}

.plan-cta{
  margin-top:22px;display:block;text-align:center;padding:13px 16px;border-radius:3px;
  font-size:13px;font-weight:600;font-family:var(--sans);letter-spacing:-0.005em;
  border:1px solid var(--hairline);background:var(--white);color:var(--navy);
  transition:border-color .12s,background .12s,color .12s;
}
.plan-cta:hover{border-color:var(--navy)}
.plan.feat .plan-cta{background:var(--protocols);border-color:var(--protocols);color:var(--ink)}
.plan.feat .plan-cta:hover{background:var(--amberDeep);border-color:var(--amberDeep)}
.plan-fine{margin-top:12px;font-family:var(--mono);font-size:9px;color:var(--steel);letter-spacing:0.1em;text-align:center;text-transform:uppercase}
.plan.feat .plan-fine{color:var(--steelMute)}

/* ─── TESTIMONIALS ─── */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tc{background:var(--white);border:1px solid var(--hairline);border-radius:3px;padding:24px 22px;display:flex;flex-direction:column;gap:14px}
.tc .stars{font-family:var(--mono);font-size:10px;letter-spacing:0.4em;color:var(--protocols)}
.tc p{font-size:14px;line-height:1.6;color:var(--navy);text-wrap:pretty}
.tauth{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:14px;border-top:1px solid var(--hairlineSoft)}
.tauth .av{
  width:34px;height:34px;background:var(--paper);border:1px solid var(--hairline);
  border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:11px;color:var(--navy);letter-spacing:0.04em;
}
.aname{font-size:13px;font-weight:600;color:var(--navy)}
.arole{font-family:var(--mono);font-size:9px;color:var(--steel);letter-spacing:0.1em;text-transform:uppercase;margin-top:2px}

/* ─── CTA STRIP ─── */
.cta{
  background:var(--navy);color:var(--cream);border:1px solid var(--navy2);border-radius:4px;
  padding:56px 48px;position:relative;overflow:hidden;
}

/* ─── Icons ─── */
function ck(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'}
function xx(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'}

var lang='es';
var currency='usd';

function setL(l){
  lang=l;
  try{localStorage.setItem('laserrx_tour_lang',l);}catch(e){}
  document.querySelectorAll('.lb').forEach(function(b){b.classList.toggle('on',b.dataset.l===l);});
  document.documentElement.lang=l;
  render();
}

function setCurrency(c){
  currency=c;
  document.querySelectorAll('.cur-btn').forEach(function(b){b.classList.toggle('on',b.dataset.c===c);});
  renderPlans();
}

function planHref(key){
  if(key==='pro')   return currency==='mxn'?PRO_MXN:PRO_USD;
  if(key==='elite') return currency==='mxn'?ELITE_MXN:ELITE_USD;
  return CHAT;
}

function renderPlans(){
  var t=T[lang];
  var p=PRICING[currency];
  var grid=document.getElementById('plansGrid');
  if(!grid) return;
  grid.innerHTML=t.plans.map(function(plan){
    var pr=p[plan.key];
    var cur=p.sym;
    var num=pr.day.replace(p.sym,'');
    var on=plan.on.map(function(x){return '<div class="feat-row">'+ck()+'<span>'+x+'</span></div>';}).join('');
    var off=plan.off.map(function(x){return '<div class="feat-row off">'+xx()+'<span>'+x+'</span></div>';}).join('');
    var eye=plan.badge?'<div class="plan-eye"><span class="badge">'+plan.badge+'</span></div>':'<div class="plan-eye">'+plan.eye+'</div>';
    var href=planHref(plan.key);
    var ext=href.indexOf('http')===0?' target="_blank" rel="noopener"':'';
    return '<div class="plan'+(plan.feat?' feat':'')+'">'
      + eye
      + '<div class="plan-name">'+plan.name+'</div>'
      + '<div class="price-block">'
      +   '<div class="price-big"><span class="currency">'+cur+'</span>'+num+'</div>'
      +   '<div class="price-side">'
      +     '<span class="price-unit">'+pr.dayUnit+'</span>'
      +     '<span class="price-cap">'+pr.cap+'</span>'
      +   '</div>'
      + '</div>'
      + '<div class="price-sub"><span class="x">'+t.prFact+'</span><span>'+pr.bill+'</span></div>'
      + '<div class="plan-desc">'+plan.desc+'</div>'
      + '<div class="feats">'+on+off+'</div>'
      + '<a class="plan-cta" href="'+href+'"'+ext+'>'+plan.cta+'</a>'
      + '<div class="plan-fine">'+plan.fine+'</div>'
      + '</div>';
  }).join('');
}

/* ─── Tour ─── */
function openTour(){
  var ifr=document.getElementById('tourIframe');
  ifr.src='tour.html?lang='+lang+'&tour=1';
  document.getElementById('tourModal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeTour(){
  document.getElementById('tourModal').classList.remove('open');
  document.body.style.overflow='';
  document.getElementById('tourIframe').src='about:blank';
}
document.getElementById('tourModal').addEventListener('click',function(e){
  if(e.target===this) closeTour();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeTour();
});

/* boot */
render();
